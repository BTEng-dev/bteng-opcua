name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # bteng is MIT and published on PyPI, so install the release rather than
          # main: git+ tracks an unreleased tip and pins nothing. bteng >= 0.3.2
          # requires Python 3.12, which is why the matrix is 3.12 only -- the old
          # 3.10 and 3.11 legs could not install it from git at all.
          pip install "bteng>=0.3.2"
          pip install asyncua pyyaml pytest pytest-asyncio
          pip install -e . --no-deps

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/test_subscribe_integration.py --ignore=tests/test_integration.py -v

      - name: Run integration tests
        run: pytest tests/test_integration.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check bteng_opcua/
      - run: mypy bteng_opcua/ --ignore-missing-imports
